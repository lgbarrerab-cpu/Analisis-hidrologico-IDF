# ═════════════════════════════════════════════════════════════════════════════
# idf_tool — Configuración del análisis hidrológico e IDF
# ═════════════════════════════════════════════════════════════════════════════
# Edita los valores según tu caso. Todo parámetro NO declarado aquí toma su
# valor por defecto (ver `idf_tool/config.py:CONFIG_DEFAULT`).
# ═════════════════════════════════════════════════════════════════════════════

# ── Rutas ─────────────────────────────────────────────────────────────────────
# Coloca todos los CSVs IDEAM (principal + auxiliares) en `carpeta_entrada`.
carpeta_entrada: ./entrada
carpeta_salida : ./salida
subcarpetas_salida: [datos, graficas, informe]
versionado_timestamp: false   # true → cada run en su propia subcarpeta run_YYYYMMDD_HHMMSS

# ── Identificación de la estación principal (E1) ──────────────────────────────
# Si dejas archivo_principal vacío, se toma el primer CSV alfabético de la
# carpeta. El resto se considera auxiliar.
archivo_principal: null         # ej: "35020030_principal.csv"
codigo_estacion  : null         # null → se autodetecta del campo CodigoEstacion
nombre_estacion  : ""
entidad          : ""
proyecto         : "Análisis pluviométrico e IDF"

# Coordenadas (opcional). Sólo necesarias si vas a usar IDW como completamiento.
# Formato: {"codigo": [latitud, longitud, elevación_msnm]}
coordenadas:
  # "35020030": [5.331, -72.395, 350]
  # "35020045": [5.421, -72.510, 420]

# ── Validación de unidades (clave) ────────────────────────────────────────────
# IDEAM exporta a veces décimas de mm con etiqueta 'mm'. La autodetección
# evalúa el máximo anual medio y elige factor 1.0, 0.1 o 0.01.
factor_conversion        : auto
rango_Pmax24_esperado_mm : [30, 250]   # rango regional Colombia continental

# ── Filtros técnicos IDEAM ────────────────────────────────────────────────────
filtro_variable  : PRECIPITACION
filtro_parametro : "Día Pluviométrico (convencional)"
filtro_aprobacion: [Definitivo, Preliminar]
filtro_unidad    : mm

# ── Completamiento multi-estación ─────────────────────────────────────────────
# auto → elige el mejor según las auxiliares disponibles:
#        - ≥2 aptas + ≥30 días de solape → regresión múltiple
#        - 1 apta                         → regresión simple
#        - fallback                       → razón normal (Paulhus & Kohler 1952)
metodo_completamiento: auto    # auto | razon_normal | regresion_simple | regresion_multiple | idw
min_anios_comunes    : 10      # umbral WMO 168 para validez de regresión
r_minimo             : 0.70    # correlación mínima para considerar una auxiliar apta
sesgo_max_pct        : 15.0    # sesgo medio relativo máximo aceptable

# ── Filtros de completitud ────────────────────────────────────────────────────
min_meses_anio        : 6      # años con menos meses se descartan
max_dias_faltantes_mes: 5
umbral_completitud_mes: 0.85   # ≥ 85 % de días con dato/mes

# ── Análisis de frecuencias ───────────────────────────────────────────────────
Tr_diseno          : 25                              # años (RAS 2017 típico)
Tr_lista_IDF       : [2, 3, 5, 10, 25, 50, 100, 200, 500]
nivel_significancia: 0.05

# Distribuciones probabilísticas a evaluar (9 disponibles).
# La elegida con `dist_seleccionada: auto` será la que NO rechace KS ni AD
# con menor AIC. Otra opción: poner el nombre exacto, ej: "Gumbel".
distribuciones:
  - Log-Pearson III   # Bulletin 17B/17C — recomendada USGS
  - Gumbel            # tradicional valores extremos
  - Log-Normal
  - Normal
  - Gamma
  - GEV
  - Weibull
  - Pearson III
  - Exponencial

dist_seleccionada: auto

# ── Outliers (Grubbs-Beck, Bulletin 17B App. 4) ───────────────────────────────
tratamiento_outliers: conservar   # conservar | eliminar | reemplazar

# ── IDF Chen (1983) — relaciones lluvia regionalizadas ────────────────────────
# Valores típicos zona tropical Colombia (ajustar con pluviógrafos si disponibles)
R1: 0.45   # P1h/P24h
R2: 0.50   # P6h/P24h → cuidado con la definición; ver Chen 1983 sec. 4
R3: 0.73   # P100a/P10a (factor frecuencia)

# ── IDF Díaz-Granados / INVIAS 2009 — coeficientes por región ─────────────────
region_IDF: Orinoquia   # Andina | Caribe | Pacifico | Orinoquia

# ── Métodos IDF a calcular ────────────────────────────────────────────────────
# Comentar (#) los que no quieras. Sherman y Bernard se calibran sobre Chen
# (no requieren pluviógrafos pero su uso queda restringido a hidrología urbana
# por la naturaleza del ajuste).
metodos_IDF:
  - Chen 1983
  - Diaz-Granados INVIAS 2009
  - Sherman 1931
  - Bernard 1932
  - Bell 1969
  - Kothyari-Garde 1992

# ── Duraciones (min) para las curvas IDF ──────────────────────────────────────
duraciones_min: [5, 10, 15, 20, 30, 45, 60, 75, 90, 120, 150, 180]

# ── Intervalos de confianza por bootstrap ─────────────────────────────────────
calcular_IC       : true
nivel_confianza_IC: 0.95
n_bootstrap       : 1000   # 200 si tienes prisa; 5000 para publicación
semilla_aleatoria : 42

# ── Tests hidrológicos ────────────────────────────────────────────────────────
# Implementados: Wald-Wolfowitz (indep.), Mann-Kendall + Sen (tendencia),
# Wilcoxon (homogeneidad mediana), Pettitt (punto de cambio), autocorr. lag-1
ejecutar_tests: true

# ── Salidas ───────────────────────────────────────────────────────────────────
generar_excel: true
generar_pdf  : true
generar_word : true     # requiere python-docx
verbose      : true
